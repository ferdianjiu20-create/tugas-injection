{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm border-0 border-top border-info border-4">
    <div class="card-body p-4">
        <h4 class="card-title text-info mb-3"><i class="bi bi-terminal"></i> Network Diagnostic Tool</h4>
        <form method="POST" class="d-flex gap-2">
            <input type="text" name="ip" class="form-control" placeholder="Alamat IP (Coba: 127.0.0.1 & dir)" required>
            <button type="submit" class="btn btn-info text-white px-4">Execute Ping</button>
        </form>

        {% if submitted %}
            <hr>
            <div class="alert alert-dark font-monospace small"><b>Command Executed:</b> {{ command }}</div>
            <div class="bg-dark text-success p-3 rounded font-monospace" style="overflow-x: auto;">
                <pre class="m-0">{% if output %}{{ output }}{% else %}{{ error }}{% endif %}</pre>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
