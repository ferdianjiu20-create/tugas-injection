<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>IT Server Ping - SIRS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f8f9; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; }
        pre { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 5px; overflow-x: auto; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        {% include 'navbar.html' %}

        <h2>📡 IT Server Connectivity Test (Ping)</h2>
        <form method="POST" action="/ping" style="margin-top: 15px;">
            <input type="text" name="ip" placeholder="Masukkan IP (Uji: 127.0.0.1 & dir)" style="width: 60%; padding: 10px;" required>
            <button type="submit" style="padding: 10px 20px; background: #0d6efd; color: white; border: none; border-radius: 4px; font-weight: bold;">Ping IP</button>
        </form>

        <!-- HASIL OUTPUT TERMINAL PING -->
        {% if output %}
            <h3 style="margin-top: 25px;">Hasil Output Terminal:</h3>
            <pre>{{ output }}</pre>
        {% endif %}
    </div>
</body>
</html>
