<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pencarian Pasien - SIRS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f8f9; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #e2f0fb; }
    </style>
</head>
<body>
    <div class="container">
        {% include 'navbar.html' %}

        <h2>🔍 Pencarian Data Pasien</h2>
        <form method="GET" action="/search" style="margin-bottom: 20px;">
            <input type="text" name="nama" value="{{ search_key or '' }}" placeholder="Cari nama pasien..." style="padding: 8px; width: 300px;">
            <button type="submit" style="padding: 8px 15px; background: #0d6efd; color: white; border: none; border-radius: 4px;">Cari</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nama Pasien</th>
                    <th>Diagnosa</th>
                    <th>Kamar</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                {% for p in pasien_list %}
                <tr>
                    <td>{{ p.id }}</td>
                    <td>{{ p.nama }}</td>
                    <td>{{ p.diagnosa }}</td>
                    <td>{{ p.kamar }}</td>
                    <td><a href="/detail_pasien?id={{ p.id }}">Detail Detail (URL SQLi)</a></td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" style="text-align: center;">Data tidak ditemukan.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
