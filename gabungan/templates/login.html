<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - SIRS Lab</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f8f9; padding: 20px; margin: 0; }
        .login-card { max-width: 400px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-control { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 10px; background: #0d6efd; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div style="max-width: 1000px; margin: 0 auto;">
        {% include 'navbar.html' %}

        <div class="login-card">
            <h2>🔑 Login SIRS</h2>
            {% if error %}
                <p style="color: red; font-size: 0.9rem;">{{ error }}</p>
            {% endif %}
            <form method="POST" action="/login">
                <label>Username:</label>
                <input type="text" name="username" class="form-control" placeholder="Payload SQLi: ' OR '1'='1" required>
                
                <label>Password:</label>
                <input type="password" name="password" class="form-control" placeholder="Password bebas..." required>
                
                <button type="submit" class="btn-submit">Masuk</button>
            </form>
        </div>
    </div>
</body>
</html>
