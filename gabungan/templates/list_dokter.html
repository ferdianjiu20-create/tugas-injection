{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm border-0 border-top border-success border-4">
    <div class="card-body p-4">
        <h4 class="card-title text-success mb-4"><i class="bi bi-file-medical-fill"></i> Daftar Dokter Jaga</h4>
        
        <div class="table-responsive">
            <table class="table table-hover table-bordered align-middle">
                <thead class="table-success text-center">
                    <tr>
                        <th width="15%">ID Staff</th>
                        <th width="50%">Username / Nama Dokter</th>
                        <th width="35%">Role / Departemen</th>
                    </tr>
                </thead>
                <tbody>
                    {% for d in dokter %}
                    <tr>
                        <td class="text-center fw-bold text-muted">DR-{{ d['id'] }}</td>
                        <td class="fw-bold text-success"><i class="bi bi-person-badge"></i> {{ d['username'] }}</td>
                        <td class="text-center"><span class="badge bg-success">{{ d['role'] }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <a href="/" class="btn btn-secondary mt-3">⬅ Kembali ke Dashboard</a>
    </div>
</div>
{% endblock %}
